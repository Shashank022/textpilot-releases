name: Publish Passport Photo Studio v0.1.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-passport-photo-studio.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download built installers
        env:
          WIN_URL: 'https://sdmntpreastus2.oaiusercontent.com/files/00000000-ad30-81f6-96c4-9f6f1bdb3680/raw?se=2026-10-12T00%3A08%3A56Z&sp=r&sv=2026-02-06&sr=b&scid=0b9f12e6-88ed-5adf-aba1-9de359b413f7&skoid=dd316919-ffbf-4550-9c54-dfc99f412009&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-11T23%3A12%3A29Z&ske=2026-10-12T23%3A12%3A29Z&sks=b&skv=2026-02-06&sig=NjIS8MCweEKDML1gB/mtyYOHqIZEtvZMYRtGwEUf6pM%3D'
          ARM_URL: 'https://sdmntprsoutheastus3.oaiusercontent.com/files/00000000-4248-820c-ae60-127ddcce6dee/raw?se=2026-10-12T00%3A09%3A00Z&sp=r&sv=2026-02-06&sr=b&scid=d7e92878-faf0-52cb-8d6b-7c539f1babda&skoid=dd316919-ffbf-4550-9c54-dfc99f412009&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-11T23%3A15%3A01Z&ske=2026-10-12T23%3A15%3A01Z&sks=b&skv=2026-02-06&sig=dgbXwSnm2Hyr/o0fdSyN0ZakSca0%2BLFaCcC3LnoPWUw%3D'
          INTEL_URL: 'https://sdmntpreastus2.oaiusercontent.com/files/00000000-eeb0-81f6-beee-2c2bc9f0ac3f/raw?se=2026-10-12T00%3A09%3A04Z&sp=r&sv=2026-02-06&sr=b&scid=9c53e683-9b87-5add-a6b3-df089ea54f6e&skoid=dd316919-ffbf-4550-9c54-dfc99f412009&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-11T23%3A21%3A16Z&ske=2026-10-12T23%3A21%3A16Z&sks=b&skv=2026-02-06&sig=RuVvtaOiTg3%2BQU71vCKcTD2BAw5vsGm01nrS7m5z5Qk%3D'
        run: |
          set -euo pipefail
          mkdir -p zips release
          curl -fL "$WIN_URL" -o zips/windows.zip
          curl -fL "$ARM_URL" -o zips/apple-silicon.zip
          curl -fL "$INTEL_URL" -o zips/intel.zip
          unzip -q zips/windows.zip -d release
          unzip -q zips/apple-silicon.zip -d release
          unzip -q zips/intel.zip -d release
          ls -lh release
          test -f release/Passport-Photo-Studio-Windows-x64.exe
          test -f release/Passport-Photo-Studio-Mac-Apple-Silicon.dmg
          test -f release/Passport-Photo-Studio-Mac-Intel.dmg

      - name: Publish public beta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='passport-photo-studio-v0.1.0'
          cat > notes.md <<'NOTES'
          # Passport Photo Studio v0.1.0 — Public Beta

          A private, offline-first desktop utility for preparing passport and ID photos.

          ## Included
          - Upload a photo or capture from your camera
          - U.S., India, UK, Canada and Schengen-style sizing presets
          - Interactive zoom and positioning with face-alignment guides
          - Basic resolution, framing and brightness checks
          - Export a high-quality JPEG
          - Generate a 4×6 print sheet
          - Photos are processed locally on your computer

          ## Downloads
          - Windows 64-bit — `Passport-Photo-Studio-Windows-x64.exe`
          - Mac Apple Silicon — `Passport-Photo-Studio-Mac-Apple-Silicon.dmg`
          - Mac Intel — `Passport-Photo-Studio-Mac-Intel.dmg`

          This is an independent photo-preparation utility, not a government service. Requirements can change and final acceptance is controlled by the issuing authority. Verify current official requirements before submitting a photo. Some authorities, including Canada for passport photos, require a commercial photographer/studio and professional printing; this app does not replace those requirements.
          NOTES

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG"               release/Passport-Photo-Studio-Windows-x64.exe               release/Passport-Photo-Studio-Mac-Apple-Silicon.dmg               release/Passport-Photo-Studio-Mac-Intel.dmg               --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md --prerelease
          else
            gh release create "$TAG"               release/Passport-Photo-Studio-Windows-x64.exe               release/Passport-Photo-Studio-Mac-Apple-Silicon.dmg               release/Passport-Photo-Studio-Mac-Intel.dmg               --title 'Passport Photo Studio v0.1.0 — Public Beta'               --notes-file notes.md --prerelease --repo "$GITHUB_REPOSITORY"
          fi
